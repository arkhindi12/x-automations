version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: x-automation-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-x_automation}
      POSTGRES_USER: ${POSTGRES_USER:-x_automation_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-x_automation_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - x-automation-network

  # API Server
  api-server:
    build:
      context: .
      target: api-server
    container_name: x-automation-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-x_automation_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-x_automation}
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NINEPROXY_API_KEY: ${NINEPROXY_API_KEY:-}
      NINEPROXY_GATEWAY: ${NINEPROXY_GATEWAY:-}
      NINEPROXY_BASE_URL: ${NINEPROXY_BASE_URL:-}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - x-automation-network
    volumes:
      - ./logs:/app/logs

  # Frontend
  frontend:
    build:
      context: .
      target: frontend
    container_name: x-automation-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
    ports:
      - "${FRONTEND_PORT:-5000}:5000"
    depends_on:
      - api-server
    networks:
      - x-automation-network

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: x-automation-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-server
      - frontend
    networks:
      - x-automation-network
    profiles:
      - with-nginx

volumes:
  postgres_data:
    driver: local

networks:
  x-automation-network:
    driver: bridge
